<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- user-scalable=no + maximum-scale=1.0：锁定移动端视口，禁用 WebView 原生
         双指捏合 & 双击放大（这是 WebView 原生缩放手势，与 useZoom 的 Ctrl+滚轮
         全局 UI 缩放是两回事，后者仅桌面端生效）。viewport-fit=cover 保留用于安全区。
         注意：不设置 interactive-widget=resizes-content——该值在 iOS 17.x 上会导致
         dvh 动态视口计算偏短、底部露出系统黑条；键盘让位已由 App.vue 的
         visualViewport 手动适配接管。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>LingChat</title>
    <!-- 小屏根字号缩放（min(vw,vh) 横竖屏均覆盖，!important 防止构建产物覆盖） -->
    <style></style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
